# Dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem per week;
# major versions are ignored (2026-09-29): the biweekly upstream check flags a major that
# breaks something, and Dependabot security alerts still fire for any version.
# Semantic upstream drift (ESPN, Gemini model ids) is the
# Edge-Spectrum Upstream Check routine's job -- see Docs/UPSTREAMS.md.
# Merging main deploys to Vercel; CI (lint + check:* + build) gates every PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/site"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
