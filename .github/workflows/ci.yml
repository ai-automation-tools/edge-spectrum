name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Vercel project's runtime (Project Settings > Node.js Version: 24.x).
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # For check:spectrum-browser, the last step of verify (a smoke test of the built pages).
      - run: npx playwright install --with-deps chromium
      # Every check, in order: the list is the `verify` script in site/package.json, and
      # docs/README.md says what each one holds (audit DOC-16).
      - run: npm run verify
