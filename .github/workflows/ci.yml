name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # For check:spectrum-browser, the last step of verify (a smoke test of the built pages).
      - run: npx playwright install --with-deps chromium
      # Every check, in order: the list is the `verify` script in site/package.json, and
      # docs/README.md says what each one holds (audit DOC-16).
      - run: npm run verify
