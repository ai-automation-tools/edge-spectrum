name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run gen:edges -- --check
      - run: npm run check:market
      - run: npm run check:engine
      - run: npm run check:edges
      - run: npm run check:spectrum
      - run: npm run check:odds
      - run: npm run check:stats
      - run: npm run check:strategy-url
      - run: npm run check:calc-url
      - run: npm run check:lines
      - run: npm run check:live-grading
      - run: npm run build:registry -- --check
      - run: npm run check:deployment
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:fork
      # Browser smoke test of the built Spectrum page (Action 2.9); needs dist/ from build.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:spectrum-browser
