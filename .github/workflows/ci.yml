name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Warns, never fails: rebuilding needs Chrome + Archify, which CI doesn't have. A warning
      # means code cited by docs/diagrams/hub-data-flow.json changed since its pinned commit;
      # docs/diagrams/README.md says how to update it. Runs from the repo root (the script is there).
      - name: Diagram drift
        working-directory: .
        run: node scripts/build-diagram.mjs --hook | sed 's/^ISSUE:/::warning title=Diagram drift::ISSUE:/'
      - run: npm ci
      - run: npm run lint
      - run: npm run gen:edges -- --check
      - run: npm run check:market
      - run: npm run check:engine
      - run: npm run check:edges
      - run: npm run check:spectrum
      - run: npm run check:odds
      - run: npm run check:stats
      - run: npm run check:strategy-url
      - run: npm run check:calc-url
      - run: npm run check:lines
      - run: npm run build:registry -- --check
      - run: npm run check:deployment
      - run: npm run build
      # Browser smoke test of the built Spectrum page (Action 2.9); needs dist/ from build.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:spectrum-browser
