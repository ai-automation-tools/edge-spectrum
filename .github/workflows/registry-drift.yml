name: Registry drift

# Daily: is the Cronsole catalog the site serves (edge-spectrum.ai-automation-tools.dev/registry/) the
# one on main, with the CORS header the Cronsole gallery needs? A deploy that failed or never ran leaves
# site/public/registry/ correct and the public copy stale, and nothing inside the repo can see that.
# A failure here means redeploy main on Vercel.
# The same job smoke-checks the live site (routes answer, unknown paths are 404, the dataset is the
# one on main, a backtest runs) and that the public demo is still in demo mode. It also runs after
# each production deploy, so a bad deploy is reported within minutes, not the next morning.
on:
  schedule:
    - cron: '41 6 * * *'
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Not `check`: that is the CI job's name, and a skipped job here must never stand in for it.
  live:
    # Only this repo's own site, and for deploys only a finished production one.
    if: >-
      github.repository == 'ai-automation-tools/edge-spectrum' &&
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Hosted catalog matches site/public/registry/
        run: node site/scripts/check-registry-published.mjs
      - name: Live site answers and the demo is in demo mode
        if: always()
        run: node site/scripts/check-live.mjs
