<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Edge Spectrum — a growing collection of interactive tools for sports betting, gambling, investing, and odds analysis. Includes the Edge Spectrum expected-return visualization and a 26-season sports betting backtest simulator." />
    <title>Edge Spectrum</title>
    <link rel="canonical" href="https://edge-spectrum.ai-automation-tools.dev/" />
    <meta name="theme-color" content="#060606" />
    <script>
      // Apply the stored theme before first paint so a light-mode visitor never sees a dark
      // flash. The fallback (dark) must match DEFAULT_THEME in src/theme.ts and the copy of
      // this script in public/spectrum/index.html; all three share the edge-spectrum.theme key.
      (function () {
        var t = 'dark';
        try { if (localStorage.getItem('edge-spectrum.theme') === 'light') t = 'light'; } catch (e) {}
        document.documentElement.classList.add(t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f7');
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Edge Spectrum" />
    <meta property="og:description" content="Tools for pricing a bet or an asset honestly: an expected-return visualizer, a 26-season backtest simulator, and no-vig calculators." />
    <meta property="og:site_name" content="Edge Spectrum" />
    <meta property="og:url" content="https://edge-spectrum.ai-automation-tools.dev/" />
    <meta property="og:image" content="https://edge-spectrum.ai-automation-tools.dev/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Edge Spectrum: tools for pricing a bet or an asset honestly" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Self-hosted Inter and JetBrains Mono (audit GOV-04): no request leaves the site for a font. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

<!-- Consent gate. One shared copy served from the org apex, so the banner and the
     notice it links to are maintained in a single place across every site. -->
<script src="https://ai-automation-tools.dev/consent.js" defer></script>
<!-- Opt-in page counts, loaded only after the banner is accepted (audit PROD-14). -->
<script src="/counting.js" defer></script>
  </body>
</html>
